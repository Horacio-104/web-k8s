apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-k8s-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-k8s
  template:
    metadata:
      labels:
        app: web-k8s
    spec:
      containers:
      - name: web-container
        image: web-k8s:v1
        imagePullPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: web-k8s-service
spec:
  type: NodePort
  selector:
    app: web-k8s
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080